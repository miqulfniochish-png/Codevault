<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1117"><meta name="description" content="CodeVault — your code, organized.">
  <title>CodeVault — Code repository</title><link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body data-theme="midnight">
  <div class="ambient"></div>
  <header class="topbar">
    <a class="brand" href="/" data-nav="home"><span class="brand-mark">⌘</span><span>Code<span class="brand-accent">Vault</span></span></a>
    <div class="top-actions">
      <label class="searchbox"><span>⌕</span><input id="search" placeholder="Search repositories..." autocomplete="off"></label>
      <select id="language" aria-label="Language"><option value="uz">UZ</option><option value="en">EN</option><option value="ru">RU</option><option value="kk">KK</option></select>
      <button class="icon-btn" id="themeButton" title="Appearance">◐</button>
      <button class="avatar" id="accountButton">?</button>
    </div>
  </header>
  <main id="app" class="shell"><div class="loading-state"><div class="spinner"></div><p>Opening your vault...</p></div></main>
  <nav class="mobile-nav glass-dock" id="mainDock" aria-label="Main navigation">
    <span class="dock-indicator" id="dockIndicator" aria-hidden="true"></span>
    <button data-nav="home" class="dock-item" aria-label="Asosiy"><span class="dock-icon">⌂</span><span>Asosiy</span></button>
    <button data-nav="my" class="dock-item" aria-label="Profil"><span class="dock-icon">◉</span><span>Profil</span></button>
    <button data-nav="settings" class="dock-item" aria-label="Sozlamalar"><span class="dock-icon">⚙</span><span>Sozlamalar</span></button>
  </nav>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
</body>
</html>
